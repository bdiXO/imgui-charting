<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC · Pro Flow</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #06080f; 
            overflow: hidden; 
        }
        /* Make the C++ canvas stretch to the edges of the window */
        canvas.emscripten { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            border: 0px none; 
            outline: none;
        }
        /* Non-blocking WebGL context loss banner */
        #webgl-lost-banner {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 10px 16px;
            background: #7b1c1c;
            color: #ffd5d5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        #webgl-lost-banner span { flex: 1; }
        #webgl-lost-banner button {
            background: #c0392b;
            color: #fff;
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 4px 14px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        #webgl-lost-banner button:hover { background: #e74c3c; }
        #webgl-restored-flash {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 8px 16px;
            background: #1a4a2e;
            color: #7fff9a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            text-align: center;
            z-index: 99999;
        }
    </style>
</head>
<body>
    <!-- WebGL context loss banner (non-blocking) -->
    <div id="webgl-lost-banner">
        <span>⚠ WebGL context lost — your GPU ran out of memory or was reset by the browser.</span>
        <button onclick="location.reload()">Reload Page</button>
    </div>
    <!-- Brief success flash on restoration -->
    <div id="webgl-restored-flash">✓ WebGL context restored</div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // ── WebGL context loss ──────────────────────────────────────────────
          // Call preventDefault() to allow the browser to restore the context
          // automatically. Show a non-blocking banner so the user knows what
          // happened without a page-freezing alert().
          canvas.addEventListener("webglcontextlost", function(e) {
            e.preventDefault();

            var banner = document.getElementById('webgl-lost-banner');
            if (banner) banner.style.display = 'flex';

            // Suppress Emscripten's own "abort()" error overlay if it fires
            // by catching the unhandled rejection that sometimes follows.
            window._webglContextLost = true;
          }, false);

          // ── WebGL context restored ──────────────────────────────────────────
          // The browser has successfully restored the WebGL context. The
          // Emscripten/ImGui OpenGL3 backend does not support automatic
          // resource re-upload (shaders, font atlas texture, VBOs), so a
          // full page reload is still the most reliable recovery path.
          // We give the user 3 seconds to see the "restored" flash before
          // reloading automatically — they can cancel by clicking Reload
          // themselves, which also clears the reload timer.
          canvas.addEventListener("webglcontextrestored", function(e) {
            window._webglContextLost = false;

            var banner = document.getElementById('webgl-lost-banner');
            if (banner) banner.style.display = 'none';

            var flash = document.getElementById('webgl-restored-flash');
            if (flash) {
              flash.style.display = 'block';
              // Auto-reload after 2 s so ImGui font textures are re-uploaded
              setTimeout(function() {
                location.reload();
              }, 2000);
            }
          }, false);

          return canvas;
        })()
      };

      // Prevent Emscripten's default abort handler from showing a second
      // error popup when the context loss already forced a bail-out.
      window.addEventListener('error', function(e) {
        if (window._webglContextLost) {
          e.preventDefault();
          return true;
        }
      });
    </script>
    
    <script async type="text/javascript" src="btc_terminal.js"></script>
</body>
</html>
